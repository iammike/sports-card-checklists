<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' https: data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://cards-oauth.iammikec.workers.dev https://cdnjs.cloudflare.com;">
    <title>Mike's Sports Card Checklists</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="dist/shared.min.css">
    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Barlow', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 0 20px 0;
            color: #fff;
            --color-surface: rgba(255,255,255,0.05);
            --color-text: #ccc;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding-top: 40px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-mark {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            text-align: center;
            font-size: 2.8em;
            font-weight: 400;
            letter-spacing: 0.05em;
            margin: 0;
            line-height: 1;
            background: linear-gradient(180deg, #d0d0d0 0%, #f39c12 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-card {
            display: inline-block;
            width: 22px;
            height: 30px;
            background: linear-gradient(145deg, #f39c12 0%, #d35400 100%);
            border-radius: 2px;
            position: relative;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        .logo-card::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 1px;
        }
        .logo-card.left {
            transform: rotate(-8deg);
        }
        .logo-card.right {
            transform: rotate(8deg);
        }
        .subtitle {
            font-family: 'Barlow', sans-serif;
            text-align: center;
            color: #555;
            font-size: 0.75em;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .checklist-filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: space-between;
        }
        input.checklist-search {
            width: 200px;
            padding: 8px 12px;
            font-size: 0.75em;
            font-weight: 600;
            border-color: rgba(255,255,255,0.12);
            border-radius: 3px;
        }
        input.checklist-search:focus {
            border-color: rgba(243, 156, 18, 0.4);
            outline: none;
        }
        .checklist-search::placeholder {
            color: #555;
            font-style: italic;
        }
        .checklist-filter-pills {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .filter-pill {
            font-family: 'Barlow', sans-serif;
            font-size: 0.75em;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-pill:hover {
            border-color: rgba(255,255,255,0.2);
            color: #999;
        }
        .filter-pill.active {
            background: rgba(243, 156, 18, 0.15);
            border-color: rgba(243, 156, 18, 0.3);
            color: #f39c12;
        }
        .checklist-no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: #555;
            font-family: 'Barlow', sans-serif;
            font-size: 0.9em;
        }
        /* The message is a live region, so it stays in the DOM (and the
           accessibility tree) even with nothing to say - a region inserted at the
           same moment as its text is not reliably announced. Taking the empty one
           out of flow keeps it from claiming a grid row. */
        .checklist-no-results:empty {
            position: absolute;
            padding: 0;
        }
        .checklist-card {
            --card-accent: #f39c12;
            --card-accent-rgb: 243, 156, 18;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            padding: 22px 24px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
            overflow: hidden;
        }
        .checklist-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border-color: rgba(var(--card-accent-rgb), 0.4);
        }
        .checklist-card h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5em;
            font-weight: 400;
            letter-spacing: 0.03em;
            margin-bottom: 8px;
            color: var(--card-accent);
        }
        .checklist-card p {
            font-family: 'Barlow', sans-serif;
            color: #999;
            font-size: 0.9em;
            line-height: 1.5;
            font-weight: 500;
        }
        /* Main progress section */
        .checklist-card .progress-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .checklist-card .main-progress {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .checklist-card .progress-ring {
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .checklist-card .progress-ring svg {
            transform: rotate(-90deg);
            width: 48px;
            height: 48px;
        }
        .checklist-card .progress-ring circle {
            fill: none;
            stroke-width: 4;
        }
        .checklist-card .progress-ring .bg {
            stroke: rgba(255,255,255,0.1);
        }
        .checklist-card .progress-ring .fill {
            stroke: var(--card-accent);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s ease;
        }
        .checklist-card .progress-ring .percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85em;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--card-accent);
        }
        .checklist-card .progress-details {
            flex: 1;
        }
        .checklist-card .progress-main-text {
            font-family: 'Barlow', sans-serif;
            font-size: 0.9em;
            color: #ccc;
            font-weight: 500;
        }
        .checklist-card .progress-main-text span {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15em;
            color: var(--card-accent);
            font-weight: 400;
        }
        .checklist-card .value-line {
            font-family: 'Barlow', sans-serif;
            font-size: 0.75em;
            font-weight: 500;
            color: #666;
            margin-top: 2px;
        }
        .checklist-card .value-line .value-owned {
            color: #4caf50;
        }
        .checklist-card .value-line .value-needed {
            color: #ff9800;
        }
        /* Secondary stats - right column */
        .checklist-card .secondary-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .checklist-card .stat-pill {
            font-family: 'Barlow', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            background:
                linear-gradient(90deg,
                    rgba(255,255,255,0.05) var(--pill-pct, 0%),
                    transparent var(--pill-pct, 0%)),
                rgba(255,255,255,0.05);
            border-radius: 3px;
            font-size: 0.7em;
            font-weight: 500;
            color: #666;
        }
        .checklist-card .stat-pill .count {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1em;
            color: #888;
            transform: translateY(1px);
        }
        .checklist-card .stat-pill.complete {
            background: rgba(76, 175, 80, 0.12);
            color: #4caf50;
        }
        .checklist-card .stat-pill.complete .count {
            color: #4caf50;
        }
        /* Completed checklist card */
        .checklist-card.complete {
            border-left-color: #f1c40f !important;
            background: linear-gradient(135deg, rgba(241,196,15,0.1) 0%, rgba(241,196,15,0.05) 100%) !important;
        }
        .checklist-card.complete:hover {
            border-color: rgba(241,196,15,0.6);
        }
        .checklist-card.complete h2 {
            color: #f1c40f;
        }
        .checklist-card.complete .progress-ring .fill {
            stroke: #f1c40f;
        }
        .checklist-card.complete .progress-ring .percentage {
            color: #f1c40f;
        }
        .checklist-card.complete .progress-main-text span {
            color: #f1c40f;
        }
        .coming-soon {
            opacity: 0.5;
            pointer-events: none;
        }
        .coming-soon h2::after {
            content: " (Coming Soon)";
            font-size: 0.6em;
            color: #666;
        }
        /* Aggregate Stats Section - "Championship Scoreboard" */
        .aggregate-stats {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 100%),
                linear-gradient(135deg, #0a0a12 0%, #1a1a2e 100%);
            border: 1px solid rgba(255,182,18,0.2);
            border-radius: 4px;
            padding: 24px 28px 20px;
            margin-bottom: 24px;
            position: relative;
            box-shadow:
                0 4px 24px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .aggregate-stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f39c12, transparent);
        }
        .aggregate-stats::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,182,18,0.3), transparent);
        }
        .aggregate-stats-label {
            font-family: 'Barlow', sans-serif;
            font-size: 0.7em;
            font-weight: 600;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #f39c12;
            margin-bottom: 16px;
            text-align: center;
            position: relative;
        }
        /* Fully collected - mirrors .checklist-card.complete one level up */
        .aggregate-stats.complete {
            border-color: rgba(241,196,15,0.45);
        }
        .aggregate-complete-check {
            display: none;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4em;
            line-height: 1;
            letter-spacing: normal;
            color: #f1c40f;
        }
        .aggregate-stats.complete .aggregate-complete-check {
            display: block;
        }
        .aggregate-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .aggregate-stat {
            text-align: center;
            padding: 20px 12px 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            animation: statReveal 0.6s ease-out backwards;
        }
        .aggregate-stat:nth-child(1) { animation-delay: 0.1s; }
        .aggregate-stat:nth-child(2) { animation-delay: 0.2s; }
        .aggregate-stat:nth-child(3) { animation-delay: 0.3s; }

        @keyframes statReveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .aggregate-stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.2em;
            font-weight: 400;
            line-height: 1;
            margin-bottom: 4px;
            color: #c8c8c8;
            letter-spacing: 0.02em;
        }
        /* Larger size for owned/total count stats to fill their boxes */
        #agg-owned,
        #agg-total {
            font-size: 3.5em;
        }
        .aggregate-stat-value.highlight {
            color: #f39c12;
            text-shadow: 0 2px 20px rgba(243,156,18,0.3);
        }
        .aggregate-stat-label {
            font-family: 'Barlow', sans-serif;
            font-size: 0.65em;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }
        .aggregate-stat-breakdown {
            font-family: 'Barlow', sans-serif;
            font-size: 0.7em;
            font-weight: 500;
            color: #555;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .aggregate-stat-breakdown .owned { color: #4caf50; }
        .aggregate-stat-breakdown .needed { color: #ff9800; }

        .site-footer {
            margin-top: 60px;
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .site-footer a {
            font-family: 'Barlow', sans-serif;
            font-size: 0.75em;
            font-weight: 500;
            color: #555;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .site-footer a:hover {
            color: #888;
        }
        .site-footer svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        @media (max-width: 500px) {
            .logo-card { display: none; }
            .aggregate-stats { padding: 20px 16px 16px; }
            .aggregate-stats-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .aggregate-stat { padding: 14px 12px 12px; }
            .aggregate-stat-value { font-size: 2.6em; }
            .checklist-grid {
                grid-template-columns: 1fr;
            }
            .checklist-filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            input.checklist-search {
                width: 100%;
                box-sizing: border-box;
            }
            .checklist-filter-pills {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

    <script>
        // Progress ring constants (must match SVG circle r="20" and stroke-dasharray="125.6")
        const PROGRESS_RING_RADIUS = 20;
        const PROGRESS_RING_CIRCUMFERENCE = 2 * Math.PI * PROGRESS_RING_RADIUS;

        // Animate a number counting up
        function animateValue(element, start, end, duration, prefix = '', suffix = '') {
            const startTime = performance.now();
            const update = (currentTime) => {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                // Ease out cubic for satisfying deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.round(start + (end - start) * easeOut);
                element.textContent = prefix + current + suffix;
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            };
            requestAnimationFrame(update);
        }

        // Track if we've animated yet (only animate once)
        let hasAnimatedStats = false;

        function updateAggregateStats(allStats, uniqueOwned, configs = {}) {
            let totalOwned = 0, totalCards = 0, totalOwnedValue = 0, totalNeededValue = 0;
            let hasAnyStats = false;

            Object.values(allStats).forEach(stats => {
                if (stats) {
                    hasAnyStats = true;
                    totalOwned += stats.owned || 0;
                    totalCards += stats.total || 0;
                    totalOwnedValue += stats.ownedValue || 0;
                    totalNeededValue += stats.neededValue || 0;
                }
            });

            // Prefer the live de-duplicated numbers when available: they are
            // computed from current card data (so they include extras and reflect
            // cross-checklist de-dup immediately), whereas the summed stats above
            // can lag until each checklist re-saves. Fall back to the sums only
            // when the live computation is unavailable.
            if (uniqueOwned != null) {
                totalOwned = uniqueOwned.count;
                totalOwnedValue = uniqueOwned.value;
            }

            if (!hasAnyStats) return;

            const statsEl = document.getElementById('aggregate-stats');
            statsEl.style.display = 'block';

            // The same split as a single checklist's header, one level up: the
            // value sums every owned card while the count sums main-category
            // totals, so if any checklist excludes cards from its own count the
            // two tiles are measuring different things (#775). "Total Cards" is
            // this row's own count label, so it names the completion scope the
            // way a checklist's totalLabel does on its page.
            // Gated on having stats: only checklists that actually contribute
            // to these sums can make the two disagree. A new checklist with a
            // split config and nothing recorded yet would otherwise relabel a
            // row it adds nothing to.
            const anyExcludes = Object.entries(configs)
                .some(([id, c]) => allStats[id] && countExcludesExtras(c));
            document.getElementById('agg-value-label').textContent =
                anyExcludes ? 'Est. Value (all cards)' : 'Est. Value';
            const aggCompletionScope = anyExcludes ? ' (total cards)' : '';
            // "Total Cards" over a sum that leaves cards out. It cannot borrow a
            // checklist's own label the way the cards above it do, because it
            // sums several and theirs disagree - so it says what is true of all
            // of them (#779).
            //
            // "Targeted", not "tracked" and not "counted". Tracked was false -
            // the excluded extras have owned checkboxes, feed the Est. Value in
            // the very next tile, and get their own pills on the cards below.
            // Counted was true but read as machinery: it described what the code
            // does rather than what the number means. These are the cards being
            // chased, which is also the word the checklists themselves use -
            // jayden-daniels names its own count "Target Cards".
            //
            // Unqualified when nothing is excluded, same rule as the value label.
            // "Cards Owned" beside it is left alone: it is main-only and
            // de-duplicated too, so it is accurate as a pair with this number
            // rather than neutral on its own.
            document.getElementById('agg-total-label').textContent =
                anyExcludes ? 'Cards Targeted' : 'Total Cards';

            // A finished collection suppresses the "to complete" line rather than
            // reading "$0 to complete", the same way a completed checklist card
            // drops its own needed-value line.
            const isComplete = totalCards > 0 && totalOwned >= totalCards;
            const neededEl = document.getElementById('agg-needed-value');
            statsEl.classList.toggle('complete', isComplete);
            neededEl.style.display = isComplete ? 'none' : '';

            if (!hasAnimatedStats) {
                hasAnimatedStats = true;
                // Animate the main stats with staggered delays
                setTimeout(() => {
                    animateValue(document.getElementById('agg-owned'), 0, totalOwned, 1200);
                }, 200);
                setTimeout(() => {
                    animateValue(document.getElementById('agg-total'), 0, totalCards, 1200);
                }, 350);
                setTimeout(() => {
                    animateValue(document.getElementById('agg-value'), 0, totalOwnedValue, 1400, '$');
                }, 500);
                if (!isComplete) {
                    setTimeout(() => {
                        animateValue(neededEl, 0, totalNeededValue, 1000, '$', ' to complete' + aggCompletionScope);
                    }, 650);
                }
            } else {
                // Just update without animation (e.g., when data changes)
                document.getElementById('agg-owned').textContent = totalOwned;
                document.getElementById('agg-total').textContent = totalCards;
                document.getElementById('agg-value').textContent = '$' + totalOwnedValue;
                if (!isComplete) {
                    neededEl.textContent = '$' + totalNeededValue + ' to complete' + aggCompletionScope;
                }
            }
        }

        // Patch each checklist card's owned value with the live figure (main +
        // extra) so cards reflect extras immediately, without waiting for the
        // checklist to re-save its stats to the gist.
        function updateChecklistCardValues(uniqueOwned) {
            const perChecklist = uniqueOwned?.perChecklist;
            if (!perChecklist) return;
            Object.entries(perChecklist).forEach(([id, value]) => {
                const el = document.querySelector(`.checklist-card[data-checklist="${CSS.escape(id)}"] .value-owned`);
                // Re-apply the scope the render worked out. Rebuilding this text
                // without it silently strips "(all cards)" a moment after the
                // card appears (#775).
                if (el) el.textContent = '$' + Math.round(value) + ' value' + (el.dataset.valueScope || '');
            });
        }

        // Compute unique owned count by loading card data (gist is already cached, no extra API calls)
        async function computeUniqueOwned(entries) {
            try {
                const isLoggedIn = window.githubSync?.isLoggedIn();
                const data = isLoggedIn ? await githubSync.loadData() : await githubSync.loadPublicData();
                const allOwned = data?.checklists || {};

                // Variant excluded - same player+set+num is the same physical card
                const fingerprint = (card) => {
                    const str = (card.player || '') + (card.set || '') + (card.num || '');
                    return btoa(str.replace(/[^\x00-\xFF]/g, '_')).replace(/[^a-zA-Z0-9]/g, '');
                };

                // value spans all owned cards (main + extra) to match the
                // expanded Est. Value; count stays main-only to match the
                // main-only owned count it clamps (stats.owned).
                const uniqueFPs = new Map();     // fingerprint -> highest price (main + extra)
                const uniqueMainFPs = new Set(); // fingerprints of owned main-category cards
                const perChecklistValue = {};    // id -> owned value (main + extra), for per-card display
                for (const entry of entries) {
                    const ownedIds = allOwned[entry.id] || [];
                    if (ownedIds.length === 0) continue;

                    const config = isLoggedIn
                        ? await githubSync.loadChecklistConfig(entry.id)
                        : await githubSync.loadPublicChecklistConfig(entry.id);
                    const cardData = isLoggedIn
                        ? await githubSync.loadCardData(entry.id)
                        : await githubSync.loadPublicCardData(entry.id);
                    if (!config || !cardData) continue;

                    // Mirror getCardId(): an explicit card.id wins, but only if
                    // it passes isSafeCardId (shared.js, loaded via app.min.js)
                    const includePlayer = config.cardDisplay?.includePlayerInCardId;
                    const computeId = (card) => {
                        if (isSafeCardId(card.id)) return card.id;
                        if (includePlayer) {
                            return btoa(((card.player || '') + (card.set || '') + (card.num || '') + (card.variant || '')).replace(/[^\x00-\xFF]/g, '_')).replace(/[^a-zA-Z0-9]/g, '');
                        }
                        return btoa(((card.set || '') + (card.num || '') + (card.variant || '')).replace(/[^\x00-\xFF]/g, '_')).replace(/[^a-zA-Z0-9]/g, '');
                    };

                    // Flatten all cards (main + extra) for value; track which ids
                    // belong to main categories for the count.
                    let cards;
                    const mainIds = new Set();
                    if (config.dataShape === 'flat') {
                        cards = cardData.cards || [];
                        cards.forEach(card => { if (!card.collectionLink && !card.noCard) mainIds.add(computeId(card)); });
                    } else {
                        cards = [];
                        const mainCatIds = new Set();
                        (config.categories || []).filter(c => c.isMain !== false).forEach(cat => {
                            if (cat.children && cat.children.length > 0) {
                                cat.children.forEach(child => mainCatIds.add(child.id));
                            } else {
                                mainCatIds.add(cat.id);
                            }
                        });
                        // No main categories → engine's owned count falls back to
                        // all categories, so mirror that here (avoids undercounting).
                        for (const [catId, arr] of Object.entries(cardData.categories || {})) {
                            cards.push(...arr);
                            if (mainCatIds.size === 0 || mainCatIds.has(catId)) {
                                arr.forEach(card => { if (!card.collectionLink && !card.noCard) mainIds.add(computeId(card)); });
                            }
                        }
                    }

                    const cardById = new Map();
                    cards.forEach(card => {
                        if (card.collectionLink || card.noCard) return;
                        cardById.set(computeId(card), card);
                    });

                    // Map owned IDs to universal fingerprints, keeping highest price per card
                    ownedIds.forEach(id => {
                        const card = cardById.get(id);
                        if (!card) return;
                        const fp = fingerprint(card);
                        const price = parseFloat(card.price) || 0;
                        const existing = uniqueFPs.get(fp) || 0;
                        if (price > existing) uniqueFPs.set(fp, price);
                        else if (!uniqueFPs.has(fp)) uniqueFPs.set(fp, 0);
                        if (mainIds.has(id)) uniqueMainFPs.add(fp);
                        // Per-checklist owned value is not de-duplicated: each card
                        // shows its own full owned value (main + extra), matching the
                        // checklist page's Est. Value.
                        perChecklistValue[entry.id] = (perChecklistValue[entry.id] || 0) + price;
                    });
                }

                let uniqueValue = 0;
                uniqueFPs.forEach(price => { uniqueValue += price; });
                return { count: uniqueMainFPs.size, value: uniqueValue, perChecklist: perChecklistValue };
            } catch (e) {
                console.warn('Failed to compute unique owned stats:', e);
                return null;
            }
        }

        // Render checklist cards for dynamic (non-legacy) entries from registry
        async function renderDynamicChecklists() {
            const registry = await DynamicNav.loadRegistry();
            if (!registry || !registry.checklists) return {};

            const dynamicEntries = registry.checklists
                .filter(e => e.type === 'dynamic' && !e.hidden)
                .sort((a, b) => (a.title || a.navLabel).localeCompare(b.title || b.navLabel));
            if (dynamicEntries.length === 0) return {};

            const grid = document.querySelector('.checklist-grid');

            // Load stats for all dynamic checklists from gist
            const gistData = githubSync.isLoggedIn()
                ? await githubSync.loadData()
                : await githubSync.loadPublicData();
            const allGistStats = gistData?.stats || {};

            // Per-checklist config, purely to learn whether that checklist's
            // count excludes cards its value includes (#775).
            //
            // Every config file lives in the gist just read above, and that read
            // now hands the raw gist to _fetchGist's cache - so this loop is a
            // JSON.parse per checklist off an object already in memory, not a
            // request per checklist. That is a property of the caching, not of
            // this loop: before it, a warm load re-downloaded the whole gist
            // here, and a dead token re-downloaded it once per checklist.
            const loggedIn = githubSync.isLoggedIn();
            const configs = {};
            for (const entry of dynamicEntries) {
                // Per checklist, not around the loop: these reads JSON.parse a
                // hand-editable file, and this runs before first paint, so one
                // unparseable config would otherwise abort the entire index.
                // A missing config just means no scope labels for that card.
                // computeUniqueOwned guards its identical reads the same way.
                try {
                    configs[entry.id] = loggedIn
                        ? await githubSync.loadChecklistConfig(entry.id)
                        : await githubSync.loadPublicChecklistConfig(entry.id);
                } catch (e) {
                    console.warn(`Could not read config for ${entry.id}:`, e);
                    configs[entry.id] = null;
                }
            }

            const dynamicStats = {};

            dynamicEntries.forEach(entry => {
                const stats = allGistStats[entry.id];
                const hasStats = stats && typeof stats.owned === 'number' && stats.total > 0;
                dynamicStats[entry.id] = hasStats ? stats : null;

                // Clamped here at the source rather than at each use: a stale gist
                // total can leave more cards owned than the checklist lists, and
                // both consumers below need the figure bounded. Unclamped it drives
                // stroke-dashoffset negative, which renders the ring as a broken arc
                // instead of a full one, and puts aria-valuenow above aria-valuemax.
                // Completeness is decided from owned/total further down, not from
                // this, so nothing wants the raw figure.
                const pct = hasStats && stats.total > 0
                    ? Math.min(Math.round((stats.owned / stats.total) * 100), 100)
                    : 0;
                const offset = PROGRESS_RING_CIRCUMFERENCE - (pct / 100) * PROGRESS_RING_CIRCUMFERENCE;
                const description = entry.description || '';
                // Both land in a CSS declaration below, so validate rather than
                // escape - see isSafeColor in shared.js. An invalid border color
                // falls back to the accent, same as an absent one.
                const accent = isSafeColor(entry.accentColor) ? entry.accentColor : '#667eea';
                const borderColor = isSafeColor(entry.borderColor) ? entry.borderColor : accent;
                // The value spans every owned card while the count beside it may
                // not, so say so - and the "to complete" figure shares the
                // count's scope, not the value's (#775).
                const config = configs[entry.id];
                const valueScope = countExcludesExtras(config) ? ' (all cards)' : '';
                const completionScope = completionScopeSuffix(config, config?.totalLabel);
                // "45 of 60 cards" called a target count plain cards, while the
                // checklist's own header called it Target Cards (#779). Shared
                // with nothing else today, but it lives in shared.js beside the
                // rule it is built on rather than being inlined here.
                const countNoun = countNounFor(config);

                const isComplete = hasStats && stats.total > 0 && stats.owned >= stats.total;
                // The ring draws a checkmark instead of the percentage once complete,
                // and a bare checkmark announces as nothing useful. The meaning lives
                // on the ring's own role/value instead, so the glyph can stay
                // decorative.
                const ringText = isComplete ? 'Complete' : pct + '% collected';
                const card = document.createElement('a');
                card.href = `checklist.html?id=${entry.id}`;
                card.className = 'checklist-card' + (isComplete ? ' complete' : '');
                card.dataset.checklist = entry.id;
                card.style.cssText = `--card-accent: ${accent}; border-left: 3px solid ${borderColor}; background: linear-gradient(135deg, ${borderColor}18 0%, ${accent}0d 100%);`;
                card.innerHTML = `
                    <h2>${sanitizeText(entry.title)}</h2>
                    ${description ? `<p>${sanitizeText(description)}</p>` : ''}
                    ${entry.hideMainCount ? '' : hasStats ? `
                    <div class="progress-section" style="display:block">
                        <div class="main-progress">
                            <div class="progress-ring" role="progressbar" aria-label="${sanitizeAttr(countNoun)} collected"
                                aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-valuetext="${ringText}">
                                <svg viewBox="0 0 48 48" aria-hidden="true">
                                    <circle class="bg" cx="24" cy="24" r="20"/>
                                    <circle class="fill" cx="24" cy="24" r="20"
                                        stroke-dasharray="${PROGRESS_RING_CIRCUMFERENCE}" stroke-dashoffset="${offset}"/>
                                </svg>
                                <span class="percentage" aria-hidden="true">${isComplete ? '&#10003;' : pct + '%'}</span>
                            </div>
                            <div class="progress-details">
                                <div class="progress-main-text">
                                    ${sanitizeText(stats.owned)} of ${sanitizeText(stats.total)} ${sanitizeText(countNoun)}
                                </div>
                                <div class="value-line">
                                    <span class="value-owned"${valueScope ? ` data-value-scope="${sanitizeAttr(valueScope)}"` : ''}>$${sanitizeText(stats.ownedValue || 0)} value${sanitizeText(valueScope)}</span>${isComplete ? '' : ` · <span class="value-needed">$${sanitizeText(stats.neededValue || 0)} to complete${sanitizeText(completionScope)}</span>`}
                                </div>
                            </div>
                        </div>
                        ${entry.extraPills && hasStats ? `
                        <div class="secondary-stats">
                            ${entry.extraPills.map(pill => {
                                const owned = stats[pill.id + 'Owned'] || stats[pill.id + 'Total'] ? (stats[pill.id + 'Owned'] || 0) : 0;
                                const total = stats[pill.id + 'Total'] || 0;
                                if (total === 0) return '';
                                const pillPct = Math.round((owned / total) * 100);
                                const isComplete = owned === total;
                                // Same problem as the ring: the count collapses to a
                                // bare checkmark once complete. Naming the count spells
                                // out the figures either way, which also spares the
                                // incomplete case being read as "4 slash 9".
                                const countLabel = isComplete ? `all ${total} owned` : `${owned} of ${total} owned`;
                                return `<span class="stat-pill${isComplete ? ' complete' : ''}" style="--pill-pct: ${pillPct}%">${sanitizeText(pill.label)} <span class="count" role="img" aria-label="${sanitizeAttr(countLabel)}">${isComplete ? '\u2713' : `${sanitizeText(owned)}/${sanitizeText(total)}`}</span></span>`;
                            }).join('')}
                        </div>` : ''}
                    </div>` : '<div class="progress-section" style="display:block"><p style="font-size:12px;color:#666;">No cards yet</p></div>'}
                `;
                grid.appendChild(card);
            });

            return { stats: dynamicStats, entries: dynamicEntries, configs };
        }

        function initChecklistFilters() {
            const searchInput = document.getElementById('checklist-search');
            const filterBar = document.getElementById('checklist-filter-bar');
            const pills = filterBar.querySelectorAll('.filter-pill');
            const grid = document.querySelector('.checklist-grid');
            let activeFilter = 'all';

            function applyFilters() {
                const query = searchInput.value.toLowerCase().trim();
                const cards = grid.querySelectorAll('.checklist-card');
                let visibleCount = 0;

                cards.forEach(card => {
                    const title = card.querySelector('h2')?.textContent.toLowerCase() || '';
                    const desc = card.querySelector('p')?.textContent.toLowerCase() || '';
                    const matchesSearch = !query || title.includes(query) || desc.includes(query);

                    let matchesFilter = true;
                    if (activeFilter !== 'all') {
                        const progressText = card.querySelector('.progress-main-text')?.textContent || '';
                        const match = progressText.match(/(\d+)\s+of\s+(\d+)/);
                        const owned = match ? parseInt(match[1]) : 0;
                        const total = match ? parseInt(match[2]) : 0;
                        const hasCards = total > 0;

                        // Complete is owned >= total, matching the card's own test above,
                        // not owned === total. A stale gist total can leave more cards
                        // owned than the checklist lists, and on 12 of 10 the strict
                        // equality matched none of the three filters - not Complete, not
                        // In Progress, not Not Started - so a card the page was styling as
                        // complete could only be found under All (#717). The three states
                        // have to partition every owned/total pair; the hasCards guard is
                        // what keeps an empty checklist out of Complete, since 0 >= 0.
                        if (activeFilter === 'complete') matchesFilter = hasCards && owned >= total;
                        else if (activeFilter === 'in-progress') matchesFilter = hasCards && owned > 0 && owned < total;
                        else if (activeFilter === 'not-started') matchesFilter = !hasCards || owned === 0;
                    }

                    const visible = matchesSearch && matchesFilter;
                    card.style.display = visible ? '' : 'none';
                    if (visible) visibleCount++;
                });

                // Show/hide "no results" message. The element is permanent and only
                // its text changes, so the announcement lands in a live region that
                // was already there rather than in one appearing alongside its text.
                const noResults = document.getElementById('checklist-no-results');
                if (noResults) {
                    noResults.textContent = visibleCount === 0 && cards.length > 0
                        ? 'No checklists match your search.'
                        : '';
                }
            }

            searchInput.addEventListener('input', applyFilters);
            document.querySelector('#checklist-filter-bar .search-clear')?.addEventListener('click', () => {
                searchInput.value = '';
                searchInput.focus();
                applyFilters();
            });

            pills.forEach(pill => {
                pill.addEventListener('click', () => {
                    pills.forEach(p => {
                        p.classList.remove('active');
                        p.setAttribute('aria-pressed', 'false');
                    });
                    pill.classList.add('active');
                    pill.setAttribute('aria-pressed', 'true');
                    activeFilter = pill.dataset.filter;
                    applyFilters();
                });
            });

            // Show filter bar now that cards are rendered
            filterBar.style.display = '';
        }

        async function init() {
            if (window.githubSync) {
                await githubSync.handleCallback();
                AuthUI.update();
                githubSync.onAuthChange = () => AuthUI.update();
            }
            // Secret login: click "Mike's" to sign in
            document.getElementById('mike-link').addEventListener('click', () => {
                if (!githubSync.isLoggedIn()) {
                    githubSync.login();
                }
            });

            // Render dynamic checklist cards from registry and aggregate stats
            const { stats: allStats, entries, configs } = await renderDynamicChecklists();
            if (entries && entries.length > 0) initChecklistFilters();
            const uniqueOwned = await computeUniqueOwned(entries);
            updateAggregateStats(allStats, uniqueOwned, configs);
            updateChecklistCardValues(uniqueOwned);

            // Render nav links + hamburger (registry already cached by renderDynamicChecklists)
            await DynamicNav.init();

            // Add "Create New Checklist" to dropdown menu (owner-only)
            if (githubSync.isLoggedIn()) {
                const user = githubSync.getUser();
                if (user && user.login === OWNER_USERNAME) {
                    const checklistCreator = new ChecklistCreatorModal({
                        onCreated: (config) => {
                            window.location.href = `checklist.html?id=${config.id}`;
                        }
                    });
                    const dropdown = document.getElementById('nav-dropdown');
                    if (dropdown) {
                        const logoutBtn = document.getElementById('auth-logout-btn');
                        const divider = document.createElement('div');
                        divider.className = 'nav-dropdown-divider';
                        const createBtn = document.createElement('button');
                        createBtn.className = 'nav-dropdown-item';
                        createBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> New Checklist';
                        createBtn.onclick = () => {
                            dropdown.classList.remove('open');
                            checklistCreator.open();
                        };
                        dropdown.insertBefore(divider, logoutBtn);
                        dropdown.insertBefore(createBtn, logoutBtn);
                    }
                }
            }
        }
        init();
    </script>
</body>
